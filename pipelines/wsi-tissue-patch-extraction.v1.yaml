# Real-WSI preprocessing: candidate tissue -> deterministic patch plan -> bounded extraction.
# Reader-neutral: the same definition runs on any backend that passes the capability gate.
# Model-free: no stain normalisation, resizing or channel conversion is applied to patch pixels.
# Sentinels: `mask_level: -1` = automatic; `level: -1` / `target_spacing_um: 0.0` = unset (set
# exactly one); `stride_x/stride_y: 0.0` = patch size. Override per run (stage, key, value).
schema_version: pathology-ai.pipeline/1
pipeline_id: wsi-tissue-patch-extraction
version: "1.0.0"
description: Candidate-tissue detection, patch planning and bounded patch extraction (no model).
inputs:
  - {name: image, kind: image.pyramidal_2d, spatial_kind: pyramidal_2d}
stages:
  - id: tissue
    operation: {name: tissue.detect, version: "1"}
    inputs:
      - {name: image, kind: image.pyramidal_2d, spatial_kind: pyramidal_2d}
    outputs:
      - {name: mask, kind: mask.tissue_2d}
    config:
      detector: saturation_otsu
      validity_policy: require_reported
      mask_level: -1
      max_mask_pixels: 1048576
      max_decoded_pixels: 67108864
      tile_px: 2048
      min_threshold: 8
      open_radius: 0
      close_radius: 0
    resources: {memory_mb: 512}
  - id: plan
    operation: {name: patch.plan, version: "1"}
    inputs:
      - {name: image, kind: image.pyramidal_2d, spatial_kind: pyramidal_2d}
      - {name: mask, kind: mask.tissue_2d}
    outputs:
      - {name: plan, kind: patch_plan}
    config:
      units: pixels
      width: 256
      height: 256
      stride_x: 0.0
      stride_y: 0.0
      level: -1
      target_spacing_um: 0.5
      spacing_tolerance: 0.15
      grid_origin_x: 0
      grid_origin_y: 0
      edge_policy: inside_only
      min_tissue_fraction: 0.5
      min_acquired_fraction: 0.9
      validity_policy: require_reported
      selection: fail_closed
      max_patches: 512
      max_candidates: 250000
    resources: {memory_mb: 256}
  - id: extract
    operation: {name: patch.extract, version: "1"}
    inputs:
      - {name: image, kind: image.pyramidal_2d, spatial_kind: pyramidal_2d}
      - {name: mask, kind: mask.tissue_2d}
      - {name: plan, kind: patch_plan}
    outputs:
      - {name: manifest, kind: patch_manifest}
    config:
      materialize_pixels: true
      batch_size: 32
      max_patches: 512
      max_batch_bytes: 67108864
      max_output_bytes: 268435456
    resources: {memory_mb: 1024}
edges:
  - [$input.image, tissue.image]
  - [$input.image, plan.image]
  - [tissue.mask, plan.mask]
  - [$input.image, extract.image]
  - [tissue.mask, extract.mask]
  - [plan.plan, extract.plan]
outputs:
  mask: tissue.mask
  plan: plan.plan
  manifest: extract.manifest
